name: Build Package

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

env:
  # 版本号单一来源。
  # 1.0-15：v15 修 hook 无限递归（抖音随机闪退）。
  # 1.0-16：v16 修「小窗切下一条视频仍留上一条的声音」（用户实测）。
  #         轮询改为每 tick 现算 newest + 停旧；play 事件即停旧；
  #         轮询窗口从 8 秒延长到整个后台期。
  VERSION: 1.0-16
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  # ---------------------------------------------------------------------
  # 第一道闸：源码级静态校验（不依赖工具链，秒级）
  #
  # ★ 检查项以「装上去会不会出问题」为主，不只查「编不编得过」。
  #   本插件历史上真实出过的事故：
  #     ① v15 让抖音不定时闪退（511 帧 hook 自我递归 → 栈溢出）
  #     ② v12 多个视频声音一起响（用户实测）
  #     ③ v15 小窗切下一条视频后仍留上一条的声音（用户实测，v16 修）
  # ---------------------------------------------------------------------
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Source self-check
        run: |
          set -e
          python3 tools/check_source.py

      # ★ 反向验证：证明上面的检查项「真的在跑」。
      #   只有「注入违规 → 检查必须非 0」才能证明判据有效；
      #   否则「全部通过」可能只是「检查压根没执行」。
      #   ★ 每一例都断言「是哪个判据拦下的」，不只看红没红 ——
      #     注入可能顺带破坏别的判据，「红了」不等于「红对了」。
      - name: Verify checks actually fire (negative test)
        run: |
          set -e
          python3 tools/verify_negative.py

  # ---------------------------------------------------------------------
  # 构建：零 Theos（xcrun clang → codesign → Python 拼 ar）
  # ---------------------------------------------------------------------
  build:
    needs: verify
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show toolchain
        run: |
          set -e
          xcrun --sdk iphoneos --show-sdk-path
          xcrun --sdk iphoneos --show-sdk-version

      # ★ 只编 arm64：宿主是抖音 App，App Store 分发的 App 一律 arm64。
      #   包标签分两种只是为了让不同设备的 Sileo 都愿意安装，
      #   dylib 本身在两种包里字节相同。
      - name: Build (arm64e label)
        run: |
          set -e
          sh devkit/build.sh iphoneos-arm64e "$VERSION"
          sh devkit/mkdeb.sh iphoneos-arm64e "$VERSION"
          cp .build/out/*.deb .

      - name: Build (arm64 label)
        run: |
          set -e
          sh devkit/build.sh iphoneos-arm64 "$VERSION"
          sh devkit/mkdeb.sh iphoneos-arm64 "$VERSION"
          cp .build/out/*.deb .

      - name: Report packages
        run: |
          set -e
          echo "--- 产物 ---"
          ls -l *.deb
          for f in *.deb; do
            echo ""
            echo "== $f =="
            echo "size   : $(wc -c < "$f")"
            echo "sha256 : $(shasum -a 256 "$f" | cut -d' ' -f1)"
          done

      - name: Upload Packages
        uses: actions/upload-artifact@v4
        with:
          name: packages-${{ env.VERSION }}
          path: "*.deb"
          if-no-files-found: error
